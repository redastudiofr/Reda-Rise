<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a2e"/>
      <stop offset="0.55" stop-color="#080b12"/>
      <stop offset="1" stop-color="#050608"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#3874dc" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#3874dc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2a5fc4"/>
      <stop offset="1" stop-color="#7fb0ff"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <g transform="translate(512 512)">
    <!-- progress ring, open at the top right: the goal not yet reached -->
    <circle r="330" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="34"/>
    <circle r="330" fill="none" stroke="url(#ring)" stroke-width="34" stroke-linecap="round"
            stroke-dasharray="1762 2074" transform="rotate(-58)"/>
    <!-- the T -->
    <rect x="-176" y="-176" width="352" height="78" rx="22" fill="#ffffff"/>
    <rect x="-39" y="-176" width="78" height="370" rx="22" fill="#ffffff"/>
    <!-- the target reached -->
    <circle cx="176" cy="-275" r="30" fill="#7fb0ff"/>
  </g>
</svg>
